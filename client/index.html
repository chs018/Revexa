<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <!-- Visual system pass: Space Grotesk (display), Inter (body/UI),
         JetBrains Mono (IDs, timestamps, tabular amounts). preconnect first
         so the actual stylesheet request doesn't pay the DNS+TLS cost twice. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Razorpay buildathon integration: Razorpay's hosted Checkout script
         — opens the real (test-mode) payment modal. Loaded globally since
         it's needed wherever the "create a real payment" trigger lives. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
